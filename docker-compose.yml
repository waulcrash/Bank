

services:
    zookeeper:
        image: confluentinc/cp-zookeeper:7.2.15
        container_name: zookeeper
        environment:
            ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}
            ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME:-2000}
        ports:
            - "${ZOOKEEPER_CLIENT_PORT:-2181}:${ZOOKEEPER_CLIENT_PORT:-2181}"
        env_file:
            - .env
        networks:
            - bank-net

    kafka:
        image: confluentinc/cp-kafka:7.2.15
        container_name: kafka
        depends_on:
            - zookeeper
        ports:
            - "9092:9092"
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT:-zookeeper:2181}
            KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:-PLAINTEXT://kafka:9092}
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        env_file:
            - .env
        networks:
            - bank-net

    postgres:
        image: postgres:latest
        container_name: postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
            POSTGRES_DB: ${POSTGRES_DB:-deal_db}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        env_file:
            - .env
        networks:
            - bank-net

    calculator:
        build: ./calculator-service
        container_name: calculator
        environment:
            PORT: ${CALCULATOR_PORT:-8080}
        ports:
            - "${CALCULATOR_PORT:-8080}:${CALCULATOR_PORT:-8080}"
        env_file:
            - .env
        networks:
            - bank-net


    deal:
        build: ./deal
        container_name: deal
        environment:
            URL_DB: ${URL_DB:-jdbc:postgresql://postgres:5432/deal_db}
            USER_DB: ${POSTGRES_USER:-postgres}
            PASSWORD_DB: ${POSTGRES_PASSWORD:-admin}
            KAFKA_SERVERS: ${KAFKA_SERVERS:-kafka:9092}
            CALCULATOR_ADDRESS: ${CALCULATOR_ADDRESS:-http://calculator:8080}
            PORT: ${DEAL_PORT:-8081}
        ports:
            - "${DEAL_PORT:-8081}:${DEAL_PORT:-8081}"
        env_file:
            - .env
        networks:
            - bank-net
        depends_on:
            - kafka
            - postgres
            - calculator

    dossier:
        build: ./dossier
        container_name: dossier
        environment:
            KAFKA_SERVERS: ${KAFKA_SERVERS:-kafka:9092}
            MAIL_USERNAME: ${MAIL_USERNAME}
            MAIL_PASSWORD: ${MAIL_PASSWORD}
            PORT: ${DOSSIER_PORT:-8082}
        ports:
            - "${DOSSIER_PORT:-8082}:${DOSSIER_PORT:-8082}"
        env_file:
            - .env
        networks:
            - bank-net
        depends_on:
            - kafka

    frontend:
        build: ./frontend
        container_name: frontend
        ports:
            - "${FRONTEND_PORT:-3000}:3000"
        env_file:
            - .env
        networks:
            - bank-net
        depends_on:
            - deal
            - dossier

networks:
    bank-net:
        driver: bridge

volumes:
    postgres_data: